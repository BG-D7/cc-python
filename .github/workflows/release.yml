name: Release

# Push a tag vX.Y.Z (matching mod_version in gradle.properties) to build, test and publish a GitHub Release.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'gradle'

      - name: Build Mod & Run Tests
        run: ./gradlew build packageAioJar packageResourcePack --no-daemon --stacktrace

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          sha256sum *-aio.jar *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "CC: Python ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Install \`cc-python-*-aio.jar\` into \`mods/\` (Minecraft 26.2, Fabric or NeoForge, CC: Tweaked 1.120.2, Java 25). \`cc-python-cyrillic-*.zip\` is the optional Cyrillic terminal font resource pack (CCPL)." \
            *-aio.jar *.zip SHA256SUMS.txt
